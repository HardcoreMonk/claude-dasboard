name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff bandit pip-audit

      - name: Ruff (lint)
        run: ruff check .

      # skips: B101 assert / B110·B112 try-except-pass·continue (의도된 resilience 패턴)
      #        B608 SQL 문자열 조립 (CLAUDE.md 규약: 값은 전 파라미터화, 식별자는 화이트리스트 — 수동 게이트로 검증)
      - name: Bandit (security scan)
        run: bandit -r . -x ./.venv,./tests,./node_modules -s B101,B110,B112,B608 -q

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --strict

      # e2e 스모크 테스트가 /static/bundle.vN.js 를 fetch — 산출물(bundle.js)은
      # gitignored 라 fresh checkout 에 없으므로 pytest 전에 빌드 필요
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build JS bundle (needed by e2e smoke tests)
        run: |
          npm ci
          npm run build

      - name: Pytest
        run: python -m pytest tests/ -v --tb=short

  js-build:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check source files
        run: |
          for f in static/*.js; do
            node --check "$f"
          done
      - name: Build bundle
        run: npm run build
